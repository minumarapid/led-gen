[workspace]
members = [
    "crates/led-gen-cli",
    "crates/led-gen-core",
    "crates/led-gen-wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/minumarapid/led-gen"

[profile.release]
# Optimize for speed on native targets. Binary size for the browser build
# is contained via the per-package override for led-gen-wasm below.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.led-gen-wasm]
opt-level = "s"